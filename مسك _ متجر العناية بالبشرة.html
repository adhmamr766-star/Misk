<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسك | متجر العناية بالبشرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fdf6f3; --card:#ffffff; --ink:#4a2f2a; --muted:#9a7d77; --line:#f0dcd7;
  --rose:#c58583; --rose-d:#b2706f; --rose-l:#e8c4c0; --rose-xl:#f8e6e3;
  --head1:#e3b8b3; --head2:#c98d8b; --ok:#2f7d62; --gold:#e5a93d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1615; --card:#2a1d1b; --ink:#f6e7e3; --muted:#c3a49e; --line:#432d2a;
    --rose:#c98583; --rose-d:#d99a98; --rose-l:#5a3a37; --rose-xl:#33211f;
    --head1:#6a4440; --head2:#4e302d;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1615; --card:#2a1d1b; --ink:#f6e7e3; --muted:#c3a49e; --line:#432d2a;
  --rose:#c98583; --rose-d:#d99a98; --rose-l:#5a3a37; --rose-xl:#33211f;
  --head1:#6a4440; --head2:#4e302d;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--rose-d);outline-offset:2px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* header */
header{background:linear-gradient(90deg,var(--head1),var(--head2));position:sticky;top:0;z-index:30}
.bar{display:flex;align-items:center;gap:24px;height:72px}
.search{position:relative;width:280px;flex:none}
.search input{width:100%;height:40px;border-radius:20px;border:0;padding:0 16px 0 44px;background:rgba(255,255,255,.55);color:#4a2f2a}
.search input::placeholder{color:#8c6a65}
.search svg{position:absolute;left:14px;top:10px;width:20px;height:20px;stroke:#4a2f2a}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1;color:#5b332d}
.logo b{font-family:"Aref Ruqaa",serif;font-size:38px}
.logo small{font-size:8px;letter-spacing:5px;margin-top:-2px}
nav{display:flex;gap:26px;margin-inline-start:16px}
nav a{font-size:14px;color:#4a2f2a;padding:4px 0;border-bottom:2px solid transparent}
nav a.on{border-color:#8f4f4a;color:#8f4f4a}
.acts{margin-inline-start:auto;display:flex;gap:20px;align-items:center;color:#4a2f2a;font-size:14px}
.acts button{display:flex;gap:6px;align-items:center;color:#4a2f2a;position:relative}
.acts svg{width:22px;height:22px}
.badge{position:absolute;top:-8px;right:-6px;background:#1f1f1f;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.acts .fav-on svg{fill:#b2455a;stroke:#b2455a}

/* hero */
.hero{position:relative;line-height:0;background:#f6d9d4}
.hero img{width:100%;height:auto;display:block}
.shop-hit{position:absolute;left:28.3%;width:15.2%;top:59.7%;height:10.3%;border-radius:999px}
.btn{background:var(--rose);color:#fff;border-radius:22px;padding:10px 38px;font-weight:500;transition:background .2s}
.btn:hover{background:var(--rose-d)}

/* categories */
.cats{display:flex;gap:26px;overflow-x:auto;padding:22px 0 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;color:var(--ink);font-size:13px}
.cat .ic{width:64px;height:64px;border-radius:50%;background:var(--rose-xl);display:grid;place-items:center;border:2px solid transparent;overflow:hidden;transition:.2s}
.cat .ic svg{width:44px;height:44px}
.cat.on{font-weight:700}
.cat.on .ic{border-color:var(--rose);background:var(--rose-l)}

/* layout */
.main{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;padding:26px 0 50px}
aside{position:sticky;top:90px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel>h3{margin:0;padding:16px 18px;font-size:16px;display:flex;justify-content:space-between;align-items:center;background:var(--rose-xl)}
.panel>h3 svg{width:22px;height:22px;stroke:var(--rose)}
.pbody{padding:14px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 12px;text-align:center}
.empty svg{width:54px;height:54px;stroke:var(--rose-l)}
.empty b{display:block;margin-top:4px}
.empty p{margin:2px 0 14px;color:var(--muted);font-size:13px}
.empty .btn{display:block;width:100%;border-radius:10px;padding:9px}
.li{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li .th{width:48px;height:48px;border-radius:10px;overflow:hidden}
.li .th svg{width:100%;height:100%;display:block}
.li b{font-size:13px;display:block;line-height:1.3}
.qty{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font-size:13px}
.qty button{width:22px;height:22px;border-radius:50%;background:var(--rose-xl);color:var(--rose-d);font-weight:700;line-height:1}
.li .rm{color:var(--muted);font-size:12px;text-align:left}
.li .pr{font-weight:700;font-size:13px;display:block}
.total{display:flex;justify-content:space-between;padding:12px 0 2px;font-weight:700}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px}
.field textarea{min-height:68px;resize:vertical}
.field input.bad{border-color:#c0392b}
.err{color:#c0392b;font-size:12px;display:none}
.field input.bad+.err{display:block}
.confirm{width:100%;border-radius:8px;padding:12px;display:flex;gap:8px;justify-content:center;align-items:center;font-size:16px}
.confirm svg{width:18px;height:18px;transform:scaleX(-1)}
.trust{display:flex;justify-content:space-around;padding:14px 4px 4px;border-top:1px solid var(--line);margin-top:14px;font-size:12px;text-align:center}
.trust div{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.trust svg{width:30px;height:30px;stroke:var(--rose);fill:var(--rose-xl)}

/* products */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px}
.sort{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.img{position:relative;aspect-ratio:6/5;overflow:hidden}
.img svg,.img img,.li .th img{width:100%;height:100%;display:block;object-fit:cover}
.heart{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.heart svg{width:16px;height:16px;fill:none;stroke:#5b332d;stroke-width:2}
.heart.on svg{fill:#b2455a;stroke:#b2455a}
.tag{position:absolute;top:8px;left:8px;font-size:11px;color:#fff;border-radius:4px;padding:1px 8px}
.card h4{margin:0;padding:10px 12px 2px;text-align:center;font-size:14px;font-weight:700}
.meta{display:flex;justify-content:space-between;align-items:center;padding:0 14px 8px;font-size:12px;color:var(--muted)}
.meta .p{font-size:15px;font-weight:700;color:var(--ink)}
.stars{color:var(--gold);letter-spacing:-1px}
.add{margin:0 12px 12px;background:var(--rose-l);color:var(--rose-d);border-radius:8px;padding:6px;font-size:12px;font-weight:500;display:flex;gap:6px;justify-content:center;align-items:center;transition:.2s}
:root:not([data-theme="dark"]) .add{background:#f1d3cf;color:#7a3b37}
.add:hover{background:var(--rose);color:#fff}
.add svg{width:14px;height:14px}
.none{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}

footer{background:linear-gradient(90deg,var(--head1),var(--head2));color:#4a2f2a}
footer .in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap;padding:10px 20px}
footer .q{font-size:15px}
footer .soc{display:flex;gap:8px;align-items:center;font-size:14px}
footer .soc a{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.5);display:grid;place-items:center}
footer .soc svg{width:16px;height:16px}
footer .logo b{font-size:30px}

/* toast & modal */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:#3b2622;color:#fff;border-radius:22px;padding:10px 22px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(40,20,18,.5);display:none;place-items:center;z-index:70;padding:20px}
.modal.show{display:grid}
.box{background:var(--card);border-radius:18px;max-width:420px;width:100%;padding:28px;text-align:center}
.box .ok{width:60px;height:60px;border-radius:50%;background:#e1f3ea;color:var(--ok);display:grid;place-items:center;margin:0 auto 10px;font-size:30px}
.box h3{margin:0 0 6px}
.box p{margin:4px 0;color:var(--muted)}
.box .btn{margin-top:16px}

@media (max-width:1000px){
  .main{grid-template-columns:1fr}
  aside{position:static;max-height:none;order:2}
  nav{display:none}
  .search{width:auto;flex:1}
  .acts span{display:none}
}
@media (max-width:560px){
  .wrap{padding:0 12px}
  .bar{gap:10px}
  .logo b{font-size:30px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  function flower(x,y,s,col,op){
    var o='<g transform="translate('+x+' '+y+') scale('+s+')" opacity="'+(op||1)+'">';
    for(var i=0;i<5;i++) o+='<ellipse cx="0" cy="-22" rx="11" ry="22" fill="'+col+'" transform="rotate('+(i*72)+')"/>';
    return o+'<circle r="6" fill="#f6d27a"/></g>';
  }
  function bottle(t,x,y,k,col){

    else if(c.i==='eye') s+='<path d="M5 24c6-10 14-13 19-13s13 3 19 13c-6 10-14 13-19 13S11 34 5 24z" fill="#fff" stroke="'+col+'" stroke-width="2.500"/><circle cx="24" cy="24" r="6.500" fill="#8a5a3a"/><circle cx="24" cy="24" r="2.500" fill="#2b1a12"/>';
    else if(c.i==='set') s+='<rect x="8" y="26" width="14" height="14" rx="3" fill="'+col+'"/><rect x="26" y="20" width="14" height="20" rx="3" fill="#e9b3ab"/><path d="M13 12h4v10h-4z" fill="#8a7a5a"/>'+'<circle cx="33" cy="14" r="4" fill="#6f8a3e"/>';
    else if(c.i==='jar') s+='<rect x="9" y="14" width="30" height="8" rx="3" fill="#caa38f"/><rect x="8" y="22" width="32" height="18" rx="6" fill="'+col+'"/>';
    else if(c.i==='drop') s+='<rect x="21" y="5" width="6" height="10" rx="3" fill="#3a2622"/><rect x="19" y="14" width="10" height="5" fill="#caa38f"/><rect x="14" y="19" width="20" height="24" rx="5" fill="'+col+'"/><rect x="18" y="27" width="12" height="9" rx="2" fill="rgba(255,255,255,.7)"/>';
    else s+='<rect x="22" y="5" width="12" height="4" rx="2" fill="#caa38f"/><rect x="21" y="9" width="4" height="7" fill="#caa38f"/><rect x="15" y="16" width="18" height="27" rx="6" fill="'+col+'"/><rect x="19" y="26" width="10" height="9" rx="2" fill="rgba(255,255,255,.7)"/>';
    return s+'</svg>';
  }
  

  /* ---------- catalogue ---------- */
  var catsEl=$('#cats');
  CATS.forEach(function(c){
    var b=document.createElement('button');
    b.className='cat'+(c.id==='all'?' on':'');b.dataset.id=c.id;b.setAttribute('role','tab');
    b.innerHTML='<span class="ic">'+catIcon(c)+'</span><span>'+c.n+'</span>';
    b.onclick=function(){state.cat=c.id;state.fav=false;render()};
    catsEl.appendChild(b);
  });

  function stars(r){var f=Math.round(r);return '<span class="stars" aria-hidden="true">'+'★★★★★'.slice(0,f)+'<span style="opacity:.35">'+'★★★★★'.slice(f)+'</span></span>'}
  function list(){
    var l=P.filter(function(p){
      if(state.cat!=='all'&&p.c!==state.cat) return false;
      if(state.fav&&!state.favs[p.id]) return false;
      if(state.q&&p.n.indexOf(state.q)<0) return false;
      return true;
    });
    if(state.sort==='best') l.sort(function(a,b){return b.s-a.s});
    else if(state.sort==='low') l.sort(function(a,b){return PRICE-PRICE||a.id-b.id});
    else if(state.sort==='high') l.sort(function(a,b){return b.id-a.id});
    return l;
  }
  var HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.400-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.600-9 9-9 9z"/></svg>';
  var CART_I='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.400 11h10l2-8H6.200"/><circle cx="9" cy="19.500" r="1.200"/><circle cx="17" cy="19.500" r="1.200"/></svg>';

  function renderGrid(){
    var l=list(),g=$('#grid');
    var cname=state.fav?'المفضلة':CATS.filter(function(c){return c.id===state.cat})[0].n;
    $('#title').textContent=cname+' ('+l.length+')';
    if(!l.length){g.innerHTML='<div class="none">لا توجد منتجات مطابقة. جرّبي كلمة بحث أخرى أو تصنيفاً مختلفاً.</div>';return}
    g.innerHTML=l.map(function(p){
      return '<article class="card"><div class="img">'+art(p)+
        '<button class="heart'+(state.favs[p.id]?' on':'')+'" data-fav="'+p.id+'" aria-label="إضافة إلى المفضلة">'+HEART+'</button>'+
        (p.tag?'<span class="tag" style="background:'+p.tag[1]+'">'+p.tag[0]+'</span>':'')+'</div>'+
        '<h4>'+p.n+'</h4><div class="meta"><span>('+p.r+') '+stars(p.r)+'</span><span class="p">'+PRICE+' '+CUR+'</span></div>'+
        '<button class="add" data-add="'+p.id+'">'+CART_I+' أضف إلى السلة</button></article>';
    }).join('');
  }
  function find(id){return P.filter(function(p){return p.id==id})[0]}
  function total(){var t=0;for(var k in state.cart)t+=state.cart[k]*PRICE;return t}
  function qtyAll(){var n=0;for(var k in state.cart)n+=state.cart[k];return n}

  function renderCart(){
    var ids=Object.keys(state.cart),b=$('#cartBody');
    $('#count').textContent=qtyAll();
    if(!ids.length){
      b.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.200" stroke-linecap="round"><path d="M3 4h2l2.400 11h10l2-8H6.200"/><circle cx="9" cy="19.500" r="1.200"/><circle cx="17" cy="19.500" r="1.200"/></svg><b>سلتك فارغة</b><p>أضيفي منتجات لبدء الطلب</p><a class="btn" href="#grid">تسوقي الآن</a></div>';
      return;
    }
    b.innerHTML=ids.map(function(id){var p=find(id),q=state.cart[id];
      return '<div class="li"><div class="th">'+art(p)+'</div><div><b>'+p.n+'</b><div class="qty"><button data-dec="'+id+'" aria-label="إنقاص">−</button><span>'+q+'</span><button data-inc="'+id+'" aria-label="زيادة">+</button></div></div><div><span class="pr">'+(q*PRICE)+' '+CUR+'</span><button class="rm" data-rm="'+id+'">حذف</button></div></div>';
    }).join('')+'<div class="total"><span>الإجمالي</span><span>'+total()+' '+CUR+'</span></div><div style="font-size:12px;color:var(--muted)">الدفع عند الاستلام</div>';
  }
  function render(){
    document.querySelectorAll('.cat').forEach(function(c){c.classList.toggle('on',!state.fav&&c.dataset.id===state.cat)});
    $('#favBtn').classList.toggle('fav-on',state.fav);
    renderGrid();renderCart();
  }

  var tt;
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},1800)}

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-add],[data-fav],[data-inc],[data-dec],[data-rm]');if(!t)return;
    var d=t.dataset;
    if(d.add){state.cart[d.add]=(state.cart[d.add]||0)+1;toast('أضيف «'+find(d.add).n+'» إلى السلة')}
    else if(d.fav){if(state.favs[d.fav])delete state.favs[d.fav];else state.favs[d.fav]=1}
    else if(d.inc){state.cart[d.inc]++}
    else if(d.dec){if(--state.cart[d.dec]<=0)delete state.cart[d.dec]}
    else if(d.rm){delete state.cart[d.rm]}
    save();
    if(d.fav){t.classList.toggle('on',!!state.favs[d.fav]);if(state.fav)renderGrid()}
    else renderCart();
  });

  $('#q').addEventListener('input',function(e){state.q=e.target.value.trim();renderGrid()});
  $('#sort').addEventListener('change',function(e){state.sort=e.target.value;renderGrid()});
  $('#favBtn').onclick=function(){state.fav=!state.fav;if(state.fav)state.cat='all';render();document.getElementById('shop').scrollIntoView()};
  $('#cartBtn').onclick=function(){document.getElementById('cartPanel').scrollIntoView({block:'start'})};
  $('#themeBtn').onclick=function(){
    var r=document.documentElement,dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    var n=dark?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('misk_theme',n)}catch(e){}
  };

  /* ---------- checkout ---------- */
  $('#confirm').onclick=function(){
    var f={n:$('#fName'),p:$('#fPhone'),a:$('#fAddr')},ok=true;
    f.n.classList.toggle('bad',f.n.value.trim().length<3);
    f.p.classList.toggle('bad',f.p.value.replace(/\D/g,'').length<10);
    f.a.classList.toggle('bad',f.a.value.trim().length<6);
    ok=!document.querySelector('.field input.bad');
    if(!qtyAll()){toast('أضيفي منتجاً واحداً على الأقل');return}
    if(!ok){toast('تأكدي من تعبئة البيانات المطلوبة');return}
    var no='MSK-'+Math.floor(10000+Math.random()*90000);
    $('#mNum').textContent='رقم الطلب: '+no;
    $('#mTxt').textContent='سنتواصل معك على '+f.p.value.trim()+' لتأكيد التوصيل. الإجمالي '+total()+' '+CUR+' ويُدفع عند الاستلام.';
    $('#modal').classList.add('show');
    state.cart={};save();
    ['#fName','#fPhone','#fAddr','#fNote'].forEach(function(s){$(s).value=''});
    renderCart();
  };
  $('#mClose').onclick=function(){$('#modal').classList.remove('show')};
  $('#modal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
  document.querySelectorAll('.field input').forEach(function(i){i.addEventListener('input',function(){i.classList.remove('bad')})});

  render();
})();
</script>
</body>
</html>
